  - id: vq.longest_game_1984
    question: What was the longest game of 1984 by outs, and how many people attended?
    notes: Join of two game tables outside the semantic layer. Returns CHA198405080, 148 outs, attendance 14754.
    sql: |
      select r.game_id, r.duration_outs, r.duration_minutes, s.attendance
      from main_models.game_results as r
      join main_models.game_start_info as s on r.game_id = s.game_id
      where r.season = 1984
      order by r.duration_outs desc
      limit 1
