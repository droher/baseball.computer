[project]
name = "baseball-computer"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
authors = [{ name = "David Roher", email = "david.roher@gmail.com" }]
dependencies = [
    "duckdb~=1.5.6",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "polars>=0.20.17",
    "pyarrow>=15.0.2",
    "scipy>=1.15",
    "statsmodels>=0.14.1",
    "pyyaml>=6.0",
    "sqlmesh[lsp,web]>=0.236.2",
    "keras>=3.14.0",
]

[dependency-groups]
dev = [
    "sqlfluff>=3.0.3",
    "ipykernel>=6.25.2",
    "boto3>=1.34.45",
    "ruamel.yaml>=0.18.5",
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
]
# SQLMesh + Ibis build engine. boring-semantic-layer (in `bsl`) pins an
# incompatible sqlglot, so the groups are mutually exclusive.
build = [
    "ibis-framework[duckdb]>=12.0",
    "polars>=1.31",
    "numba>=0.59",
    "pydantic>=2.7",
]
# Hamilton ML stack on top of build. PyTorch backend for Keras 3 — MPS
# support ships in torch core, no tensorflow-metal / jax-metal plugin
# needed. Set KERAS_BACKEND=torch before importing keras (handled in
# python_models/ml/__init__.py).
ml = [
    {include-group = "build"},
    "apache-hamilton[visualization]>=1.90",
    "mlflow>=2.18",
    "scikit-learn>=1.5",
    "keras>=3.7",
    "torch>=2.5",
]

bsl = [
    "boring-semantic-layer>=0.3.12",
    "ibis-framework[duckdb]>=11.0",
]

[tool.uv]
package = false
default-groups = "all"

[tool.pytest.ini_options]
testpaths = ["bc/tests"]
pythonpath = ["bc"]
addopts = "-m 'not slow'"
markers = [
    "slow: tests that import Keras/Torch or hit bc_dev.db; opt in with `pytest -m slow`",
]

[tool.ruff.lint.per-file-ignores]
"scripts/publish_ducklake.py" = ["E402"]
