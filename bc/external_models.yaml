- name: baseballdatabank.teams
  description: 'Per-team-season Lahman master with the team_id_retro crosswalk used to translate Databank team codes to Retrosheet team codes.'
  grain:
  - year_id
  - team_id
  audits:
  - - not_null
    - columns: (year_id, team_id)
  - - not_null
    - columns: (team_id_retro)
      condition: lg_id IN ('AL', 'NL', 'AA', 'UA', 'PL', 'FL', 'NA')
  - - unique_grain
    - columns: (year_id, team_id)
- name: biodata.coaches
  description: 'Per-coach assignments by year.

    '
  column_descriptions:
    id: Retrosheet personnel id (joins biofile.id).
  grain:
  - id
  - year
  - team
- name: biodata.ejections
  description: 'Game ejections.

    '
  column_descriptions:
    game_id: 'Retrosheet game ID, A 12-character string structured as follows: - Chars 1-3: Home team ID - Chars 4-11: Date (YYYYMMDD) - Char 12: Game number (0 if only one game was played on that day) Example: MLN195607170'
    ejectee: Ejected personnel id.
    job: Role of ejectee (player, manager, coach).
    inning: -1 if pre-game.
- name: biodata.managers0
  description: 'Manager career index.

    '
  column_descriptions:
    id: Retrosheet personnel id.
    first_g: Date of first managed game.
    last_g: Date of last managed game.
  grain:
  - id
  audits:
  - - not_null
    - columns: (id)
  - - unique_values
    - columns: (id)
      condition: id IS NOT NULL
- name: biodata.relatives
  description: 'Player-family relationships graph.

    '
  column_descriptions:
    id1: First personnel id.
    relation: Relationship type (father, brother, etc.).
    id2: Second personnel id.
- name: biodata.teams
  description: 'Per-team master. Replaces per-year teams/team{YYYY}*.csv.

    '
  column_descriptions:
    team: Retrosheet team id.
    first_year: First season the team existed.
    last_year: Last season the team existed.
  grain:
  - team
  audits:
  - - not_null
    - columns: (team)
- name: biodata.umpires0
  description: 'Umpire career index.

    '
  column_descriptions:
    id: Retrosheet personnel id.
    first_g: Date of first umpired game.
    last_g: Date of last umpired game.
  grain:
  - id
  audits:
  - - not_null
    - columns: (id)
  - - unique_values
    - columns: (id)
