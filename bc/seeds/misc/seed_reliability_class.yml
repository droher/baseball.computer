version: 2
seeds:
  - name: seed_reliability_class
    config:
      contracts:
        enforced: true
    columns:
      - name: reliability_class
        description: Canonical reliability-class token used by entity, personnel, context, and exposure reliability tables.
        data_type: varchar
        constraints:
          - type: primary_key
      - name: description
        description: Human-readable description of the reliability class.
        data_type: varchar
        constraints:
          - type: not_null
      - name: is_hard_mask_eligible
        description: True when the class is high-confidence enough to serve as a hard constraint (e.g. personnel hard-zero mask).
        data_type: boolean
        constraints:
          - type: not_null
      - name: numeric_rank
        description: Ordering for authority/preference. Lower rank wins.
        data_type: utinyint
        constraints:
          - type: not_null
      - name: notes
        description: Additional clarifying notes.
        data_type: varchar
