version: 2
seeds:
  - name: seed_observed_status
    config:
      contracts:
        enforced: true
    columns:
      - name: observed_status
        description: Canonical observation-status token used by every event observation ledger and modeling dataset.
        data_type: varchar
        constraints:
          - type: primary_key
      - name: description
        description: Human-readable description of the status.
        data_type: varchar
        constraints:
          - type: not_null
      - name: is_observed
        description: True when the value comes from direct source recording at the event grain.
        data_type: boolean
        constraints:
          - type: not_null
      - name: is_training_eligible
        description: True when the value can be used as training truth.
        data_type: boolean
        constraints:
          - type: not_null
      - name: is_aggregate_only
        description: True when the value is known only at aggregate grain.
        data_type: boolean
        constraints:
          - type: not_null
      - name: notes
        description: Additional clarifying notes.
        data_type: varchar
