version: 2
seeds:
  - name: seed_nlb_lahman_player_crosswalk
    description: >-
      Retrosheet player ids for Lahman Negro Leagues people whose
      people.retro_id is wrong or missing. stg_people uses a row here in place
      of retro_id. Fill it from reviewed candidates in
      nlb_lahman_player_resolution.
    config:
      contracts:
        enforced: true
    columns:
      - name: databank_player_id
        description: Lahman people.player_id.
        data_type: varchar
        constraints:
          - type: primary_key
      - name: retrosheet_player_id
        description: Retrosheet player id.
        data_type: varchar
        constraints:
          - type: not_null
      - name: reason
        description: Evidence for the mapping.
        data_type: varchar
        constraints:
          - type: not_null
