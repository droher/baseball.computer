test_nlb_batting_lines_merges_split_lines_for_nlb_only_games:
  model: main_models.nlb_batting_lines
  inputs:
    main_models.game_start_info:
      columns:
        game_id: VARCHAR
        home_team_id: VARCHAR
        away_team_id: VARCHAR
        source_type: VARCHAR
      rows:
        - {game_id: G_NLB, home_team_id: HOM, away_team_id: AWY, source_type: NegroLeaguesStats}
        - {game_id: G_BOX, home_team_id: HOM, away_team_id: AWY, source_type: BoxScore}
    main_models.stg_nlb_batting:
      rows:
        - {game_id: G_NLB, player_id: one, team_id: HOM, lineup_position: 1, sequence: 1, is_home: true, b_ab: 4, b_h: 2, b_d: 1, b_t: 0, b_hr: 0, b_w: 1, b_roe: 1}
        - {game_id: G_NLB, player_id: split, team_id: AWY, lineup_position: 2, sequence: 1, is_home: false, b_ab: 2, b_h: 1, b_d: 0, b_t: 0, b_hr: 0}
