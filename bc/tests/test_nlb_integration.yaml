        - {game_id: G_BOX, player_id: boxed, team_id: HOM, lineup_position: 1, sequence: 1, is_home: true, b_ab: 4, b_h: 1}
  outputs:
    query:
      partial: true
      rows:
        - {game_id: G_NLB, batter_id: one, team_id: HOM, side: Home, lineup_position: 1, nth_player_at_position: 1, at_bats: 4, hits: 2, singles: 1, total_bases: 3, plate_appearances: 5, on_base_successes: 3, batting_outs: 2, reached_on_errors: 1}
