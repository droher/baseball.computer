test_event_observation_pitch_resolution_status:
  model: main_models.event_observation_pitch
  vars:
    start_season: 2000
    end_season: 2000
  inputs:
    main_models.event_states_full:
      columns:
        game_type: VARCHAR
        park_id: VARCHAR
        bat_first_side: VARCHAR
        time_of_day: VARCHAR
        frame_start: VARCHAR
        batting_side: VARCHAR
        fielding_side: VARCHAR
        batter_hand: VARCHAR
        pitcher_hand: VARCHAR
        away_team_id: VARCHAR
        home_team_id: VARCHAR
        batting_team_id: VARCHAR
        fielding_team_id: VARCHAR
        frame_end: VARCHAR
      rows:
        - {event_key: 1, game_id: G1, season: 2000, count_balls: 3, count_strikes: 2}
        - {event_key: 2, game_id: G1, season: 2000, count_balls: 0, count_strikes: 0}
        - {event_key: 3, game_id: G1, season: 2000, count_balls: null, count_strikes: null}
        - {event_key: 4, game_id: G1, season: 2000, count_balls: 1, count_strikes: 1}
    main_models.stg_event_pitch_sequence_status:
      rows:
        - {game_id: G1, event_id: 1, event_key: 1, appearance_start_event_id: 1, pitch_sequence_resolution_status: Resolved, raw_pitch_sequence: BCX, date: 2000-05-01, season: 2000}
        - {game_id: G1, event_id: 2, event_key: 2, appearance_start_event_id: 2, pitch_sequence_resolution_status: Resolved, raw_pitch_sequence: "", date: 2000-05-01, season: 2000}
        - {game_id: G1, event_id: 3, event_key: 3, appearance_start_event_id: 3, pitch_sequence_resolution_status: Unavailable, raw_pitch_sequence: "", date: 2000-05-01, season: 2000}
        - {game_id: G1, event_id: 4, event_key: 4, appearance_start_event_id: 4, pitch_sequence_resolution_status: Unresolved, raw_pitch_sequence: BBB, date: 2000-05-01, season: 2000}
    main_models.stg_event_pitch_sequences:
      columns:
        sequence_item: VARCHAR
        catcher_pickoff_attempt_at_base: VARCHAR
      rows:
        - {game_id: G1, event_id: 1, event_key: 1, sequence_id: 0, sequence_item: Ball, runners_going_flag: false, blocked_by_catcher_flag: false, catcher_pickoff_attempt_at_base: null, date: 2000-05-01, season: 2000}
        - {game_id: G1, event_id: 1, event_key: 1, sequence_id: 1, sequence_item: CalledStrike, runners_going_flag: false, blocked_by_catcher_flag: false, catcher_pickoff_attempt_at_base: null, date: 2000-05-01, season: 2000}
        - {game_id: G1, event_id: 1, event_key: 1, sequence_id: 2, sequence_item: InPlay, runners_going_flag: false, blocked_by_catcher_flag: false, catcher_pickoff_attempt_at_base: null, date: 2000-05-01, season: 2000}
    main_seeds.seed_pitch_types:
      rows:
        - {sequence_item: Ball, is_pitch: true, is_strike: false, is_in_play: false, can_be_strike_three: false, is_swing: false, is_contact: false, category: Ball}
        - {sequence_item: CalledStrike, is_pitch: true, is_strike: true, is_in_play: false, can_be_strike_three: true, is_swing: false, is_contact: false, category: Strike}
        - {sequence_item: InPlay, is_pitch: true, is_strike: true, is_in_play: true, can_be_strike_three: false, is_swing: true, is_contact: true, category: InPlay}
        - {sequence_item: StrikeUnknownType, is_pitch: true, is_strike: true, is_in_play: false, can_be_strike_three: true, is_swing: false, is_contact: false, category: Strike}
    main_models.source_acquisition_ledger:
      columns:
        team_id: VARCHAR
      rows:
        - {game_id: G1, team_id: null, dimension: event, source_family: play_by_play, source_type: PlayByPlay, target_population_status: event_level, source_block_status: present_fully_populated, source_availability_status: observed, usable_for_event_imputation: true, usable_as_aggregate_constraint: true, authority_rank: 1}
        - {game_id: G1, team_id: null, dimension: pitch_sequence, source_family: play_by_play, source_type: PlayByPlay, target_population_status: event_level, source_block_status: present_fully_populated, source_availability_status: observed, usable_for_event_imputation: true, usable_as_aggregate_constraint: true, authority_rank: 1}
    main_models.source_data_error_risk_ledger:
      columns:
        team_id: VARCHAR
      rows: []
    main_seeds.seed_data_error_class:
      columns:
        data_error_class: VARCHAR
        description: VARCHAR
        severity_rank: UTINYINT
        notes: VARCHAR
      rows: []
    main_seeds.seed_observed_status:
      rows:
        - {observed_status: observed, description: observed, is_observed: true, is_training_eligible: true, is_aggregate_only: false, notes: ""}
        - {observed_status: missing, description: missing, is_observed: false, is_training_eligible: false, is_aggregate_only: false, notes: ""}
        - {observed_status: unknown_code, description: unknown_code, is_observed: false, is_training_eligible: false, is_aggregate_only: false, notes: ""}
        - {observed_status: contradicted, description: contradicted, is_observed: false, is_training_eligible: false, is_aggregate_only: false, notes: ""}
  outputs:
    query:
      partial: true
      rows:
        - {event_key: 1, dimension: count_balls, observed_status: observed, sentinel_type: valid_value, raw_value: "3", source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Resolved}
        - {event_key: 1, dimension: count_strikes, observed_status: observed, sentinel_type: valid_value, raw_value: "2", source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Resolved}
        - {event_key: 1, dimension: pitch_sequence, observed_status: observed, sentinel_type: valid_value, raw_value: BallCalledStrikeInPlay, source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Resolved}
        - {event_key: 1, dimension: pitch_results, observed_status: observed, sentinel_type: valid_value, raw_value: BallCalledStrikeInPlay, source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Resolved}
        - {event_key: 1, dimension: strike_types, observed_status: observed, sentinel_type: valid_value, raw_value: CalledStrike, source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Resolved}
        - {event_key: 1, dimension: pitch_count_total, observed_status: observed, sentinel_type: valid_value, raw_value: "3", source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Resolved}
        - {event_key: 2, dimension: count_balls, observed_status: observed, sentinel_type: valid_value, raw_value: "0", source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Resolved}
        - {event_key: 2, dimension: count_strikes, observed_status: observed, sentinel_type: valid_value, raw_value: "0", source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Resolved}
        - {event_key: 2, dimension: pitch_sequence, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Resolved}
        - {event_key: 2, dimension: pitch_results, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Resolved}
        - {event_key: 2, dimension: strike_types, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Resolved}
        - {event_key: 2, dimension: pitch_count_total, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Resolved}
        - {event_key: 3, dimension: count_balls, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Unavailable}
        - {event_key: 3, dimension: count_strikes, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Unavailable}
        - {event_key: 3, dimension: pitch_sequence, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Unavailable}
        - {event_key: 3, dimension: pitch_results, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Unavailable}
        - {event_key: 3, dimension: strike_types, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Unavailable}
        - {event_key: 3, dimension: pitch_count_total, observed_status: missing, sentinel_type: "null", raw_value: null, source_acquisition_status: observed, model_input_eligible: false, pitch_sequence_resolution_status: Unavailable}
        - {event_key: 4, dimension: count_balls, observed_status: observed, sentinel_type: valid_value, raw_value: "1", source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Unresolved}
        - {event_key: 4, dimension: count_strikes, observed_status: observed, sentinel_type: valid_value, raw_value: "1", source_acquisition_status: observed, model_input_eligible: true, pitch_sequence_resolution_status: Unresolved}
        - {event_key: 4, dimension: pitch_sequence, observed_status: contradicted, sentinel_type: "null", raw_value: null, source_acquisition_status: contradicted, model_input_eligible: false, pitch_sequence_resolution_status: Unresolved}
        - {event_key: 4, dimension: pitch_results, observed_status: contradicted, sentinel_type: "null", raw_value: null, source_acquisition_status: contradicted, model_input_eligible: false, pitch_sequence_resolution_status: Unresolved}
        - {event_key: 4, dimension: strike_types, observed_status: contradicted, sentinel_type: "null", raw_value: null, source_acquisition_status: contradicted, model_input_eligible: false, pitch_sequence_resolution_status: Unresolved}
        - {event_key: 4, dimension: pitch_count_total, observed_status: contradicted, sentinel_type: "null", raw_value: null, source_acquisition_status: contradicted, model_input_eligible: false, pitch_sequence_resolution_status: Unresolved}
